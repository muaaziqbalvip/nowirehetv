# ==============================================================================
# Optional: deploy the Cloudflare Worker relay from CI.
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit + Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID
# After the first deploy, copy the printed URL into config.json -> proxy.base_url.
# ==============================================================================
name: _worker-deploy

on:
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE: ${{ vars.SOURCE_BASE || 'http://103.151.60.162:2122' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Explain missing secrets
        if: env.CF_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set - add it under Settings -> Secrets and variables -> Actions."
          echo "You can also deploy locally with: npx wrangler deploy"
          exit 0

      - name: Deploy worker
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@3
          wrangler deploy --var SOURCE_BASE:"$SOURCE"
          echo "::notice::copy the workers.dev URL into config.json -> proxy.base_url"

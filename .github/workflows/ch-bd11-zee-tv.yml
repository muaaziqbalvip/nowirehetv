name: ch-bd11-zee-tv

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [restart-channel]

concurrency:
  group: ch-bd11
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # never start from a push (editing this file must not launch a stream),
    # and a repository_dispatch may target a single channel
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'repository_dispatch' ||
       github.event.client_payload.channel == '' ||
       github.event.client_payload.channel == 'bd11' ||
       github.event.client_payload.channel == null)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh panel token
        continue-on-error: true
        run: |
          python3 scripts/refresh_token.py --out watch_list.json ||             echo "::warning::token refresh failed - the loop will retry every 30s"

      - name: Channel availability
        id: availability
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("watch_list.json"))
          ch = next((c for c in data.get("channels", []) if c["id"] == "bd11"), None)
          online = bool(ch and ch.get("online"))
          print(f"panel_online={online}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"online={str(online).lower()}\n")
          PY

      - name: Restream bd11 (Zee TV)
        if: steps.availability.outputs.online == 'true'
        env:
          CHANNEL_ID: "bd11"
          STAGGER_SECONDS: "260"
        run: |
          timeout 21000 bash scripts/restart_loop.sh "bd11" "$TOKEN" || true

      - name: Heartbeat
        if: always()
        continue-on-error: true
        run: bash scripts/heartbeat.sh "bd11" "finished"

      - name: Commit heartbeat
        if: always()
        continue-on-error: true
        env:
          CI_COMMIT_PATHS: ".state"
        run: |
          bash scripts/ci_commit.sh "chore(beat): bd11"

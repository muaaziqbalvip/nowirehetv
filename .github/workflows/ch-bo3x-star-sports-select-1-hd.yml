name: ch-bo3x-star-sports-select-1-hd

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [restart-channel]

concurrency:
  group: ch-bo3x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # never start from a push (editing this file must not launch a stream),
    # and a repository_dispatch may target a single channel
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'repository_dispatch' ||
       github.event.client_payload.channel == '' ||
       github.event.client_payload.channel == 'bo3x' ||
       github.event.client_payload.channel == null)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh panel token
        continue-on-error: true
        run: |
          python3 scripts/refresh_token.py --out watch_list.json ||             echo "::warning::token refresh failed - the loop will retry every 30s"

      - name: Channel availability
        id: availability
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("watch_list.json"))
          ch = next((c for c in data.get("channels", []) if c["id"] == "bo3x"), None)
          online = bool(ch and ch.get("online"))
          print(f"panel_online={online}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"online={str(online).lower()}\n")
          PY

      - name: Restream bo3x (Star Sports Select 1 HD)
        if: steps.availability.outputs.online == 'true'
        env:
          CHANNEL_ID: "bo3x"
          STAGGER_SECONDS: "40"
        run: |
          timeout 21000 bash scripts/restart_loop.sh "bo3x" "$TOKEN" || true

      - name: Heartbeat
        if: always()
        continue-on-error: true
        run: bash scripts/heartbeat.sh "bo3x" "finished"

